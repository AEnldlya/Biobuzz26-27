apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    // The simulator (src/test) runs the real robot code on the desktop JVM against the SDK
    // jars; Android framework calls that get hit return defaults instead of throwing.
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.all {
            // The simulation is sleep-bound, not CPU-bound: the robot code runs on wall-clock
            // timers, so almost all of the suite's time is spent waiting for simulated seconds
            // to pass rather than computing. Running test CLASSES side by side therefore costs
            // nearly nothing and turns the total from the sum of the classes into the length of
            // the longest one. Separate JVMs also keep the statics these tests set
            // (Constants.localizerFactory, PollenVision.CAMERA_FACTORY, Turret.LEAD_GAIN,
            // SimRobot.noiseSeed) from leaking between classes.
            // -PsimForks=1 runs the suite the old serial way, which is slower but leaves the
            // most margin on the turret test's tracking thresholds (see TurretTrackingSimTest).
            maxParallelForks = (project.findProperty('simForks') ?: Math.min(4,
                    Runtime.runtime.availableProcessors())) as int

            testLogging {
                events 'passed', 'failed', 'skipped'
                showStandardStreams = true
                exceptionFormat 'full'
            }
        }
    }
}

dependencies {
    implementation project(':FtcRobotController')
    testImplementation 'junit:junit:4.13.2'
}
