apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')
}

// Deterministic geometry, shot-calibration and localization checks on the desktop JVM.
// Use Android's resolved test classpath so the checks exercise our actual Pedro/FTC versions.
def trackingCheckTasks = ['TurretAimTest', 'ShotTableTest', 'FieldLocalizerTest'].collect { checkName ->
    tasks.register("check${checkName}", JavaExec) {
        dependsOn 'compileDebugUnitTestJavaWithJavac'
        mainClass = "org.firstinspires.ftc.teamcode.${checkName}"
        classpath = files(provider { tasks.named('testDebugUnitTest').get().classpath })
    }
}
tasks.register('trackingChecks') {
    group = 'verification'
    description = 'Run turret geometry, shot calibration, and pose reset checks without robot hardware.'
    dependsOn trackingCheckTasks
}
